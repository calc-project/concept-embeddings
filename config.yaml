input_base_dir: data/graphs
output_base_dir: output/
retrain: true
concepticon_repo: concepticon-data

graphs:
  clics4-clips:
    clics4:
      directed: false
      to_undirected: false
    clips:
      directed: true
      to_undirected: true

models:
  final:
    class:
      semantic-node2vec
    train:
      cbow: false
      max_epochs: 5000
      patience: 5
      encoder: sbert
      lr: 1e-5
      batch_size: 8224
      ns: false
      n: [33, 67]