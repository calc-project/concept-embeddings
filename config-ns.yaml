input_base_dir: data/graphs
output_base_dir: output/
eval: true

graphs:
  fullfams:
    directed: false
    to_undirected: false
  affixfams:
    directed: true
    to_undirected: true
  overlapfams:
    directed: false
    to_undirected: false

models:
  node2vec_sg_ns:
    class: node2vec
    train:
      cbow: false
      max_epochs: 1500
      patience: 5
      ns: true

  node2vec_sg_nons:
    class: node2vec
    train:
      cbow: false
      max_epochs: 1500
      patience: 5
      ns: false
